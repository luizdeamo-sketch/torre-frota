<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-build" content="202610291506">
<title>Torre de Controle - Transpanorama</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap">
<script>
  // tema antes de pintar, para não piscar
  (function(){ try{ var th = localStorage.getItem('frt_tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = th; }catch(e){ document.documentElement.dataset.theme = 'light'; } })();
</script>
<style>
:root{
  /* marca Transpanorama (canvas "Torre de Controle — Transpanorama", versão de 28/10): bordô, dourado, creme; Lato + Roboto */
  --bg:#f7f5ef; --panel:#ffffff; --panel-2:#efebe2; --ink:#2d2d2d; --ink-2:#494c4f; --ink-3:#5f6366; --line:#e6e1d6; --line-2:#cfc8b8;
  --brand:#530115; --brand-2:#4a1212; --title:#530115; --gold:#af8f28; --gold-ink:#7a6118; --gold-soft:#ded7ac;
  --accent:#530115; --accent-ink:#ffffff; --accent-soft:#f2e8ea; --pri:#530115; --pri-ink:#ffffff;
  --amber:#9a3f08; --amber-soft:#fce9dc; --red:#a3261b; --red-soft:#f9e1de; --green:#1f7a4d; --green-soft:#e2f1e8; --blue:#1456b8; --blue-soft:#e3ecf9; --gray-soft:#efebe2;
  --shadow:0 1px 2px rgba(74,18,18,.05), 0 1px 3px rgba(74,18,18,.07); --shadow-lg:0 20px 50px -24px rgba(74,18,18,.45); --veu:rgba(45,8,14,.62);
  --f:"Roboto","Segoe UI",Arial,sans-serif; --fh:"Lato","Segoe UI",Arial,sans-serif; --fm:"Roboto","Segoe UI",Arial,sans-serif;
  --r:10px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#140c0d; --panel:#1f1416; --panel-2:#2a1c1e; --ink:#f3ece9; --ink-2:#cfc4c0; --ink-3:#a39894; --line:#3a2a2c; --line-2:#4d393b;
  --brand:#3a0a14; --brand-2:#2c0a0f; --title:#f3ece9; --gold:#c9a743; --gold-ink:#dcc27a;
  --accent:#e7a9b4; --accent-ink:#140c0d; --accent-soft:#3a1c22; --pri:#c9a743; --pri-ink:#1b1404;
  --amber:#f4a26b; --amber-soft:#3a2213; --red:#ff8e80; --red-soft:#3d1a17; --green:#6fcf9b; --green-soft:#12301f; --blue:#7fa8ec; --blue-soft:#16294a; --gray-soft:#2a1c1e;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 50px -20px rgba(0,0,0,.7); --veu:rgba(0,0,0,.66); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--fm);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--ink-3)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--fh);font-weight:900;letter-spacing:-.005em;color:var(--title)}
.eyebrow{display:block;margin-bottom:4px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}

/* casca */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--brand);color:#dfe6f3;display:flex;flex-direction:column;gap:3px;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand img:not(.marca){width:34px;height:34px;border-radius:9px}
.brand b{font-family:var(--fh);font-weight:700;font-size:14px;color:#fff;display:block;line-height:1.15}
.marca{display:block;width:100%;max-width:196px;height:auto;margin:2px 0 10px}
.side{border-right:3px solid var(--gold)}
.brand small{font-size:11px;color:var(--gold);display:block;line-height:1.3}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#ecdcdf;padding:9px 10px;border-radius:8px;text-align:left;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(175,143,40,.22);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.side .grow{flex:1}
.side .quem{font-size:12px;color:#ecdcdf;padding:8px 10px;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:3px solid var(--gold);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:800;flex:1;min-width:160px}
.icon-btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;height:32px;min-width:32px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.novo{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.content{padding:20px 24px 96px;display:grid;gap:16px;width:100%}
.view{display:none}
.view.active{display:grid;gap:16px;min-width:0}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head h2{margin:0;font-size:24px}
.head p{margin:2px 0 0;color:var(--ink-2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tag{font-family:var(--f);font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--gray-soft);color:var(--ink-2);display:inline-block;white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.red{background:var(--red-soft);color:var(--red)} .tag.green{background:var(--green-soft);color:var(--green)} .tag.blue{background:var(--blue-soft);color:var(--blue)}
.sub{font-size:12px;color:var(--ink-3)}
.empty{padding:34px;text-align:center;color:var(--ink-3)}

/* barra de filtros */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.bar select,.bar input[type=search],.bar input[type=date]{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 10px;min-height:36px}
.bar input[type=search]{flex:1 1 200px;min-width:160px}
.bar .dia{display:inline-flex;align-items:center;gap:4px}
.bar .grow{flex:1}

/* chips de KPI (também filtram) */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:11px 14px;text-align:left;display:grid;gap:1px;box-shadow:var(--shadow);position:relative}
.chip b{font-family:var(--fh);font-size:26px;font-weight:800;line-height:1.1;color:var(--title)}
.chip span{font-size:12.5px;color:var(--ink-2)}
.chip small{font-size:11px;color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chip.k-red b{color:var(--red)} .chip.k-amber b{color:var(--amber)} .chip.k-green b{color:var(--green)} .chip.k-blue b{color:var(--blue)}
.filtros-ativos{display:flex;gap:6px;flex-wrap:wrap}
.filtros-ativos button{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

/* Hoje: lista de conjuntos */
.lista{display:grid;gap:8px}
.cj{display:grid;grid-template-columns:minmax(210px,1.1fr) minmax(170px,1fr) minmax(240px,1.4fr) auto;gap:12px;align-items:center;padding:8px 14px;box-shadow:none}
.cj .pl{font-family:var(--fm);font-weight:600;font-size:14px}
.cj .linha2{font-size:12px;color:var(--ink-3)}
.st-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:7px 10px;text-align:left;width:100%;min-height:42px}
.st-btn:hover{border-color:var(--ink-3)}
.st-btn .dot{width:12px;height:12px;border-radius:4px;flex:none;background:var(--line-2)}
.st-btn.vazio{border-style:dashed;border-color:var(--amber);background:var(--panel);color:var(--amber);font-weight:600}
.st-btn.vazio .dot{background:transparent;border:2px dashed var(--amber)}
.cj .ontem{font-size:12px;color:var(--ink-3)}
.cj .sinal{font-size:11.5px;font-weight:600}
.cj .sinal.red{color:var(--red)} .cj .sinal.amber{color:var(--amber)}
.grupo-h{display:flex;align-items:center;gap:8px;margin:10px 2px 2px;flex-wrap:wrap} .grupo-h b{font-family:var(--fh);font-size:15px;color:var(--title)} .grupo-h .sub{font-size:12px}
.lista .grupo-h:first-child{margin-top:0}

/* seletor de status */
.st-grid{display:grid;gap:10px}
.st-grupo b{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.st-opts{display:flex;flex-wrap:wrap;gap:6px}
.st-opt{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 10px;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.st-opt i{width:11px;height:11px;border-radius:3px}
.st-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;font-weight:700}

/* Quadro do mês: linha do tempo por conjunto */
:root{--g-rodando:#1456b8;--g-parado:#7fa8e0;--g-manut:#b3261e;--g-motorista:#d9822b;--g-ssma:#6b3fa0;--g-vazio:#c5cbd4}
:root[data-theme="dark"]{--g-rodando:#3d7be0;--g-parado:#5d86c4;--g-manut:#d9534a;--g-motorista:#e0913d;--g-ssma:#8f63c9;--g-vazio:#3a4a63}
.tl-ico{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);flex:none}
.tl-ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl-ico.mini{width:22px;height:22px;border-radius:6px} .tl-ico.mini svg{width:14px;height:14px}
.k-disp{--k:var(--green)} .k-rodando{--k:var(--g-rodando)} .k-parado{--k:var(--g-parado)} .k-manut{--k:var(--g-manut)} .k-motorista{--k:var(--g-motorista)} .k-ssma{--k:var(--g-ssma)} .k-vazio{--k:var(--ink-3)}
.tl-ico[class*="k-"]{background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k)}
.tl-resumo{padding:16px 18px;display:grid;gap:14px;border-top:4px solid var(--brand)}
:root[data-theme="dark"] .tl-resumo{border-top-color:var(--gold)}
.tl-rh{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .tl-rh>div{display:grid;min-width:0;flex:1 1 220px} .tl-rh b{font-family:var(--fh);font-size:17px;color:var(--title)}
.tl-medidor{flex:1 1 200px;max-width:520px;height:12px;border-radius:6px;background:color-mix(in srgb,var(--g-manut) 22%,transparent);overflow:hidden} .tl-medidor i{display:block;height:100%;background:var(--green);border-radius:6px}
.tl-pct{font-family:var(--fh);font-weight:800;font-size:18px}
.tl-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.tl-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-left:4px solid var(--k);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.tl-card .tl-ico{grid-row:1/4;width:36px;height:36px;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k)}
.tl-card{grid-template-columns:auto minmax(0,1fr)} .tl-card b{font-family:var(--fh);font-weight:800;font-size:24px;line-height:1.05;color:var(--k)} .tl-card span:not(.tl-ico){font-weight:600;font-size:13px;line-height:1.25}
@media (max-width:1700px){ .tl-cards .tl-card small{display:none} } .tl-card small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card:hover{border-color:var(--k)} .tl-card.on{box-shadow:0 0 0 2px var(--k) inset} .tl-card.zero{opacity:.6}
.tl{--esq:290px;overflow:auto;max-height:calc(100vh - 150px);padding:0}
.tl-in{min-width:calc(var(--esq) + var(--n) * 24px);position:relative}
.tl-cab,.tl-rl,.tl-row{display:grid;grid-template-columns:var(--esq) minmax(0,1fr)}
.tl-esq{position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:4px 10px;min-width:0}
.tl-cab{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.tl-esq-cab{z-index:7;flex-direction:column;align-items:flex-start;justify-content:center;gap:0} .tl-esq-cab b{font-family:var(--fh);color:var(--title)}
.tl-dias,.tl-rc,.tl-fundo{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.tl-d{border:0;background:transparent;padding:5px 0;display:grid;justify-items:center;font:inherit;color:var(--ink-3);cursor:pointer;border-radius:6px}
.tl-d b{font-size:12px;color:var(--ink-2)} .tl-d small{font-size:10px} .tl-d.fds{background:var(--panel-2)} .tl-d:disabled{cursor:default;opacity:.55}
.tl-d.hoje b{color:var(--red)} .tl-d.sel{box-shadow:0 0 0 2px var(--gold) inset} .tl-d:not(:disabled):hover{background:var(--accent-soft)}
.tl-res{border-bottom:2px solid var(--line);background:var(--panel-2)}
.tl-rl{--k:var(--accent)} .tl-rl .tl-esq{background:var(--panel-2);font-size:12px;font-weight:600;min-height:26px}
.tl-res .tl-rl:nth-child(1){--k:var(--green)} .tl-res .tl-rl:nth-child(2){--k:var(--g-rodando)} .tl-res .tl-rl:nth-child(3){--k:var(--g-parado)} .tl-res .tl-rl:nth-child(4){--k:var(--g-manut)} .tl-res .tl-rl:nth-child(5){--k:var(--g-motorista)} .tl-res .tl-rl:nth-child(6){--k:var(--g-ssma)} .tl-res .tl-rl:nth-child(7){--k:var(--ink-3)}
.tl-rc button{border:0;margin:1px;border-radius:4px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;color:var(--ink);background:color-mix(in srgb,var(--k) calc(var(--a) * 70%),transparent);min-height:22px;padding:0}
.tl-rc button:hover{outline:2px solid var(--ink)} .tl-rc button.sel{outline:2px solid var(--gold)} .tl-rc .fut{display:block}
.tl-corpo{position:relative}
.tl-fundo{position:absolute;top:0;bottom:0;left:var(--esq);right:0;pointer-events:none;z-index:0}
.tl-fundo i.fds{background:var(--panel-2)} .tl-fundo i.hoje{box-shadow:inset 2px 0 0 var(--red)} .tl-fundo i.sel{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.tl-row{border-bottom:1px solid var(--line);min-height:44px}
.tl-row:hover .tl-esq{background:var(--panel-2)}
.tl-quem{border:0;border-right:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer}
.tl-q{display:grid;min-width:0;flex:1} .tl-q small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-p{font-family:var(--fh);font-size:13px;white-space:nowrap}
.tl-trilha{position:relative;z-index:1;margin:7px 0;min-height:30px;cursor:copy}
.tl-trilha.ficha{min-height:34px;margin:4px 0;cursor:default;background:var(--panel-2);border-radius:8px}
.tl-bar{position:absolute;top:0;bottom:0;margin:0 1px;border:0;border-radius:7px;color:#fff;display:flex;align-items:center;gap:5px;padding:0 7px;overflow:hidden;white-space:nowrap;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(6,26,58,.18)}
.tl-bar i{display:inline-grid;flex:none} .tl-bar i svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl-bar span,.fld .tl-bar span{overflow:hidden;text-overflow:ellipsis;color:inherit;font-size:inherit;font-weight:inherit}
.fld .tl-regua span{font-size:10px;font-weight:400;color:var(--ink-3)}
.tl-bar:hover{filter:brightness(1.12);z-index:2;outline:2px solid var(--ink);outline-offset:1px}
.g-rodando{background:var(--g-rodando)} .g-parado{background:var(--g-parado);color:#10233f} .g-manut{background:var(--g-manut)} .g-motorista{background:var(--g-motorista)} .g-ssma{background:var(--g-ssma)}
.g-vazio{background:repeating-linear-gradient(45deg,var(--amber-soft),var(--amber-soft) 4px,transparent 4px,transparent 8px);border:1px dashed var(--amber);color:var(--amber);box-shadow:none}
.tl-leg{display:inline-block;width:22px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.tl-regua{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));font-size:10px;color:var(--ink-3);text-align:left}
.fc-sec{border-top:1px solid var(--line);padding-top:12px} .fc-sec h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:15px;color:var(--title)}
.tr-dias{display:grid;gap:4px;max-height:52vh;overflow:auto}
.tr-dia{display:grid;grid-template-columns:52px 14px minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font:inherit;color:inherit;cursor:pointer}
.tr-dia .dot{width:12px;height:12px;border-radius:4px} .tr-dia .sub{grid-column:3} .tr-dia:disabled{cursor:default} .tr-dia:not(:disabled):hover{border-color:var(--ink-3)}
.pct{font-family:var(--fm);font-size:11px}
.legenda{display:flex;flex-wrap:wrap;gap:10px 14px;padding:10px 12px;font-size:12px;color:var(--ink-2)}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* faturamento */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{padding:14px 16px;border-left:4px solid var(--k,var(--brand))}
:root[data-theme="dark"] .kpi{--k:var(--gold)}
.kpi small{display:block;color:var(--ink-3);font-size:12px}
.kpi b{font-family:var(--fh);font-size:24px;font-weight:800;color:var(--title)}
.kpi .sub{margin-top:2px}
.tbl-wrap{overflow:auto}
table.tb{border-collapse:collapse;width:100%}
table.tb th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
table.tb td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td.n,table.tb th.n{text-align:right;font-family:var(--fm)}
table.tb tbody tr{cursor:pointer}
table.tb tbody tr:hover td{background:var(--panel-2)}
.meter{height:8px;border-radius:5px;background:var(--gray-soft);overflow:hidden;min-width:80px;position:relative}
.meter i{display:block;height:100%;border-radius:5px;background:var(--green)}
.meter i.mid{background:#e08a1e} .meter i.low{background:var(--red)}
.meter u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

/* apresentação */
.sb{display:grid;gap:16px}
.sb-hero{background:var(--brand);color:#dce3ee;border-radius:12px;border-top:4px solid var(--gold);padding:32px 34px;display:grid;gap:12px}

.sb-hero h2{margin:0;font-size:38px;line-height:1.1;color:#fff}
.sb-hero p{margin:0;color:#dce3ee;font-size:16.5px;line-height:1.6}
.sb-hero .efeito{color:var(--gold);font-weight:600}
.sb-sec{display:grid;gap:10px}
.sb-sec>h3{margin:4px 0 0;font-size:18px}
.sb-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sb-card{padding:18px 20px;display:grid;gap:6px;align-content:start;border-top:4px solid var(--brand)}
:root[data-theme="dark"] .sb-card{border-top-color:var(--gold)}
.sb-card .verbo{font-family:var(--fh);font-weight:800;font-size:20px;color:var(--gold-ink)}
.sb-card ul{margin:0;padding-left:18px;color:var(--ink-2)}
.sb-card p{margin:0;color:var(--ink-2)}
.sb-fluxo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sb-fluxo div{padding:14px 16px;position:relative}
.sb-fluxo b{display:block;font-family:var(--fh);font-weight:700;color:var(--title)}
.sb-pri{display:grid;gap:8px}
.sb-pri div{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.sb-pri div span:first-child{font-family:var(--fh);color:var(--gold-ink);font-weight:800}
.sb-metodo{padding:16px 18px;border-top:4px solid var(--gold)}
.sb-rodape{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);padding:6px 2px}
.sb-erros{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.sb-erros div{padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.sb-erros b{font-family:var(--fh);font-weight:800;color:var(--red);min-width:46px;text-align:right}

/* sugestões */
.sg{padding:14px 16px;display:grid;gap:8px}
.sg-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg-h .grow{flex:1}
.sg p{margin:0;white-space:pre-wrap}
.sg-atts{display:flex;gap:8px;flex-wrap:wrap}
.sg-atts img{height:90px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.sg-resp{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.fld{display:grid;gap:4px} .fld span{font-size:12px;color:var(--ink-2);font-weight:500} .fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.eq-form{grid-template-columns:2fr 2fr 1fr 1fr auto;align-items:end}
#retorno-faixa{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:70;background:var(--panel);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;display:grid;gap:8px;width:min(560px,92vw)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:min(720px,100%);display:grid}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px}
.modal-h .x{border:0;background:transparent;font-size:18px;color:var(--ink-3)}
.modal-b{padding:16px 18px;display:grid;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.hist{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);max-height:180px;overflow:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:8px;padding:8px 10px} .kv small{display:block;color:var(--ink-3);font-size:11px} .kv b{font-weight:600}
.mini-mes{display:grid;grid-template-columns:repeat(31,1fr);gap:2px}
.mini-mes i{height:18px;border-radius:3px;background:var(--gray-soft)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,var(--brand-2) 0,var(--brand) 52%,var(--bg) 52%)}
.login-card{width:min(420px,100%);padding:28px;display:grid;gap:14px;border-top:4px solid var(--gold)}
.login-card .brand{padding:0}
.login-card .brand b{color:var(--title)}
.login-tema{position:absolute;top:14px;right:14px}
.login-topo{position:relative;margin:-28px -28px 4px;padding:20px 28px 16px;background:var(--brand);border-radius:var(--r) var(--r) 0 0;border-bottom:3px solid var(--gold);display:grid;gap:4px}
.login-topo .marca{max-width:240px;margin:0} .login-topo b{color:#fff;font-family:var(--fh);font-weight:900;font-size:15px} .login-topo small{color:var(--gold-soft);font-size:11.5px}
.msg{font-size:13px;border-radius:8px;padding:8px 10px;background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:500;z-index:500;box-shadow:var(--shadow-lg);max-width:min(560px,92vw)}
#nov-faixa{position:fixed;bottom:22px;left:258px;z-index:60;background:var(--panel);border:1px solid var(--amber);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:min(520px,92vw);flex-wrap:wrap}
#ac-versao{position:fixed;top:0;left:0;right:0;z-index:300;background:var(--amber);color:#fff;padding:9px 14px;font-weight:600;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
#ac-versao button{background:#fff;color:#7a3e06;border:0;border-radius:999px;padding:5px 14px;font-weight:700}

/* painel */
.pn-k{text-align:left;cursor:pointer;font:inherit;color:inherit} .pn-k:hover{border-color:var(--ink-3)}
.pn-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pn-card{padding:16px 18px 14px;display:grid;gap:12px;align-content:start;min-width:0}
.pn-largo{grid-column:1/-1}
.pn-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.pn-h h3{margin:0;font-size:17px}
.pn-linha{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;height:220px}
.pn-eixo{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--ink-3);text-align:right;margin:-6px 0}
.pn-area{position:relative;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.pn-area svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pn-grid-l{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.pn-media{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.pn-traco{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pn-fundo{fill:var(--accent);opacity:.1}
.pn-pts{position:absolute;inset:0}
.pn-pt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:0;background:transparent;padding:0;cursor:pointer}
.pn-pt::before{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2.5px solid var(--accent);box-sizing:border-box}
.pn-pt:hover::before,.pn-pt:focus-visible::before{background:var(--accent)}
.pn-pt.pior::before{border-color:var(--red)}
.pn-pt span{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-family:var(--fh);font-weight:800;font-size:11px;color:var(--red);white-space:nowrap}
.pn-dias{display:grid;margin-left:44px;font-size:10.5px;color:var(--ink-3);text-align:center}
.pn-dias .hoje{color:var(--red);font-weight:700}
.pn-pilhas{display:grid;gap:3px;height:200px;margin-left:44px;align-items:end;border-bottom:1px solid var(--line)}
.pn-pilha{height:100%;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-width:0}
.pn-pilha.fut{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--panel-2) 3px,var(--panel-2) 6px)}
.pn-pilha button{border:0;padding:0;width:100%;cursor:pointer;flex:none}
.pn-pilha button:hover{filter:brightness(1.15)}
.pn-grids,.pn-top{display:grid;gap:6px}
.pn-gl,.pn-tl{display:grid;align-items:center;gap:12px;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 6px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.pn-gl{grid-template-columns:110px minmax(0,1fr) 170px}
.pn-gl:hover,.pn-tl:hover,.pn-gl.on{background:var(--panel-2);border-color:var(--line)}
.pn-gn,.pn-gv,.pn-tn{display:grid;min-width:0} .pn-gv{text-align:right} .pn-gv b{font-family:var(--fh);font-size:18px}
.pn-trilho{position:relative;height:18px;border-radius:5px;background:var(--gray-soft);display:block;min-width:30px}
.pn-trilho i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pn-trilho u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.pn-tl{grid-template-columns:minmax(120px,1.1fr) minmax(0,1.4fr) 86px;padding:6px}
.pn-tn .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-tb{height:12px;border-radius:4px;background:var(--gray-soft);display:block;overflow:hidden} .pn-tb i{display:block;height:100%;background:var(--red);opacity:.85;border-radius:4px}
.pn-tv{text-align:right;font-family:var(--fh);font-weight:800;color:var(--red)}
@media (max-width:1100px){ .pn-grade{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){
  .pn-linha{height:170px;grid-template-columns:30px minmax(0,1fr)} .pn-dias,.pn-pilhas{margin-left:36px} .pn-pilhas{height:160px;gap:1px}
  .pn-gl{grid-template-columns:minmax(0,1fr) 96px} .pn-gl .pn-trilho{grid-column:1/-1;grid-row:2;width:100%!important}
  .pn-tl{grid-template-columns:minmax(0,1fr) 80px} .pn-tl .pn-tb{grid-column:1/-1;grid-row:2}
}

/* situação no Faturamento */
.k-critico{--k:var(--red)} .k-atencao{--k:var(--amber)} .k-ok{--k:var(--green)}
/* filtros: no celular, só data e busca; o resto em "Mais filtros" */
.bar-mais{display:none}
/* custo da parada */
.pn-h h3{display:flex;align-items:center;gap:8px}
.pn-ct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap} .pn-ct b{font-family:var(--fh);font-weight:800;font-size:30px;color:var(--red)} .pn-ct span{color:var(--ink-2)}
.pn-custo .pn-tl{grid-template-columns:minmax(240px,1.2fr) minmax(0,1.6fr) 96px}
.pn-tn b{display:flex;align-items:center;gap:6px}

/* passo a passo */
#tour-luz{position:fixed;z-index:400;border:3px solid var(--gold);border-radius:12px;box-shadow:0 0 0 9999px var(--veu);pointer-events:none;transition:all .25s ease}
#tour-luz.cheio{inset:0;border:0;border-radius:0;box-shadow:none;background:var(--veu)}
#tour-caixa{position:fixed;z-index:401;background:var(--panel);color:var(--ink);border-radius:12px;border-top:4px solid var(--gold);box-shadow:var(--shadow-lg);padding:18px 20px;display:grid;gap:10px;transition:left .25s ease,top .25s ease}
#tour-caixa.centro{left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px))}
#tour-caixa.baixo,#tour-caixa.cima{left:12px;right:12px}
#tour-caixa.baixo{bottom:12px} #tour-caixa.cima{top:12px}
#tour-caixa h3{margin:0;font-size:19px;line-height:1.25}
#tour-caixa p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.55}
.tour-passo{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.tour-pontos{display:flex;gap:5px} .tour-pontos i{width:7px;height:7px;border-radius:50%;background:var(--line-2)} .tour-pontos i.on{background:var(--gold);width:20px;border-radius:4px}
.tour-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap} .tour-acts .btn{min-height:40px}
.tour-acts [data-t="pular"]{margin-right:auto;border-color:transparent;color:var(--ink-3)}

@media (max-width:1180px){ .cj{grid-template-columns:minmax(190px,1fr) minmax(220px,1.3fr) auto} .cj .col-ontem{display:none} }
.cj>*{min-width:0} .st-btn>span{min-width:0;overflow-wrap:anywhere}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .bar input[type=search]{flex-basis:100%} .bar select{flex:1 1 140px;min-width:0}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;padding:8px 10px;gap:2px}
  .brand{padding:2px 8px 2px 2px;flex:none} .side .brand small,.side .brand b{display:none} .side .marca{width:150px;margin:0} .side{border-right:0;border-bottom:3px solid var(--gold)}
  .nav{flex:none;white-space:nowrap} .nav.on{box-shadow:inset 0 -3px 0 var(--gold)}
  .side .grow,.side .quem{display:none}
  .top{position:static;padding:10px 16px;flex-wrap:nowrap} .top h1{min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .top .icon-btn>span{display:none}
  .content{padding:14px 16px 96px}
  .eq-form{grid-template-columns:1fr 1fr}
  #nov-faixa{left:16px;right:84px;bottom:16px}
}
@media (max-width:640px){
  .cj{grid-template-columns:1fr;gap:8px}
  .bar-mais{display:inline-flex;margin-left:auto} .bar:not(.aberta) select:not(#f-mes){display:none}
  .pn-custo .pn-tl{grid-template-columns:minmax(0,1fr) 84px} .pn-custo .pn-tb{grid-column:1/-1;grid-row:2} .pn-ct b{font-size:24px}
  .form,.eq-form{grid-template-columns:1fr}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sb-hero{padding:20px} .sb-hero h2{font-size:23px}
  .tl{--esq:0px;max-height:none} .tl-in{min-width:0}
  .tl-cab{grid-template-columns:1fr;position:static} .tl-esq-cab{display:none} .tl-dias{padding:0 2px} .tl-d small{display:none} .tl-d b{font-size:9.5px}
  .tl-res{display:none}
  .tl-row{grid-template-columns:1fr;padding:6px 8px 2px} .tl-esq{position:static;border-right:0;padding:2px 0;background:transparent}
  .tl-trilha{min-height:20px;margin:4px 0 6px} .tl-bar span,.tl-bar i{display:none} .tl-bar{border-radius:4px;padding:0}
  .tl-fundo{left:0} .tl-cards{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px} .tl-card{flex:0 0 150px;scroll-snap-align:start} .tl-card b{font-size:20px}
}

<body>

<!-- LOGIN -->
<div id="login" class="login" hidden>
  <div class="card login-card">
    <div class="login-topo"><button type="button" class="icon-btn login-tema" data-theme-btn aria-label="Tema"></button><img class="marca" src="logo-transpanorama.png" alt="Transpanorama" width="424" height="58"><b class="nome-sistema">Torre de Controle</b><small>Método Torre de Controle · Capacity Case</small></div>
